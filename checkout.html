<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — Veloura</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/header-footer.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="stylesheet" href="css/checkout.css" />
  </head>
  <body data-page="checkout">
    <div id="site-header"></div>

    <main id="main">
      <section class="checkout">
        <div class="container">
          <h1>Checkout</h1>

          <p class="checkout-empty" id="checkoutEmpty" hidden>
            Your bag is empty.<br />
            <a
              class="btn btn--dark"
              href="shop.html"
              style="margin-top: 1rem; display: inline-flex"
              >Discover care</a
            >
          </p>

          <div class="checkout__inner">
            <div class="checkout-summary" id="checkoutSummary">
              <h2>Order summary</h2>
              <div id="coItems"></div>
              <div class="co-totals">
                <div class="co-totals__row">
                  <span>Subtotal</span><span id="coSubtotal">₦0</span>
                </div>
                <div class="co-totals__row">
                  <span>Delivery</span><span>Complimentary</span>
                </div>
                <div class="co-totals__row co-totals__row--total">
                  <span>Total</span><span id="coTotal">₦0</span>
                </div>
              </div>
            </div>

            <div class="checkout-form" id="checkoutFormSection">
              <h2>Shipping details</h2>
              <form id="checkoutForm">
                <div class="field">
                  <label for="shipName">Full name</label>
                  <input
                    type="text"
                    id="shipName"
                    placeholder="Your full name"
                    required
                  />
                </div>
                <div class="field">
                  <label for="shipEmail">Email</label>
                  <input
                    type="email"
                    id="shipEmail"
                    placeholder="you@example.com"
                    required
                  />
                </div>
                <div class="field">
                  <label for="shipPhone">Phone</label>
                  <input
                    type="tel"
                    id="shipPhone"
                    placeholder="+234 800 000 0000"
                    required
                  />
                </div>
                <div class="field">
                  <label for="shipAddress">Delivery address</label>
                  <input
                    type="text"
                    id="shipAddress"
                    placeholder="Street address"
                    required
                  />
                </div>
                <div class="field">
                  <label for="shipCity">City</label>
                  <input
                    type="text"
                    id="shipCity"
                    placeholder="City"
                    required
                  />
                </div>
                <button type="submit" class="btn btn--dark pay-btn" id="payBtn">
                  Pay now
                </button>
                <p class="checkout-note">
                  Payment is processed securely by Paystack. Veloura never sees
                  your card details.
                </p>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/components.js" defer></script>
    <script src="js/header.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/checkout.js"></script>
  </body>
</html>
