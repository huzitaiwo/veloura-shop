<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Veloura</title>
    <meta
      name="description"
      content="A question about a texture, an order, or where to start? Send a note and the studio will return to you shortly."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/header-footer.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body data-page="contact">
    <div id="site-header"></div>

    <main id="main">
      <section class="contact">
        <div class="container contact__inner">
          <div class="contact__intro">
            <p class="eyebrow">Get in touch</p>
            <h1>We&rsquo;re here for <em>the details.</em></h1>
            <p>
              A question about a texture, an order, or where to start? Send a
              note and the studio will return to you shortly.
            </p>

            <ul class="contact__details">
              <li>
                <svg class="icon" aria-hidden="true"><use href="#i-mail" /></svg
                ><a href="mailto:hello@veloura.studio">hello@veloura.studio</a>
              </li>
              <li>
                <svg class="icon" aria-hidden="true">
                  <use href="#i-phone" /></svg
                ><a href="tel:+12125550185">+1 212 555 0185</a>
              </li>
              <li>
                <svg class="icon" aria-hidden="true"><use href="#i-pin" /></svg
                ><span>New York, NY</span>
              </li>
            </ul>
          </div>

          <form class="contact__panel" id="contactForm">
            <div class="field">
              <label for="ctName">Name</label>
              <input
                type="text"
                id="ctName"
                name="name"
                placeholder="Your name"
                required
              />
            </div>
            <div class="field">
              <label for="ctEmail">Email</label>
              <input
                type="email"
                id="ctEmail"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="field">
              <label for="ctMessage">How can we help?</label>
              <textarea
                id="ctMessage"
                name="message"
                placeholder="Tell us a little about what you need."
                required
              ></textarea>
            </div>
            <button type="submit" class="btn btn--dark contact__submit">
              Send the note
              <svg class="icon icon--sm" aria-hidden="true">
                <use href="#i-arrow-right" />
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/components.js" defer></script>
    <script src="js/header.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/contact.js"></script>
  </body>
</html>
